name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Tachyon better. Please don't include passwords, connection strings or private data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open …
        3. See …
  - type: input
    id: version
    attributes:
      label: Tachyon version
      description: Tachyon › About Tachyon
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.1, MacBook Pro (M3)"
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version and host
      placeholder: "PostgreSQL 17, local / RDS / Supabase"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
